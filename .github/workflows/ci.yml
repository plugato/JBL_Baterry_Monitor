name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: python -m pip install --upgrade pip ruff pytest

      - name: Lint (ruff)
        run: ruff check

      - name: Tests (pytest)
        run: pytest -v

      - name: Compile all scripts
        run: python -m compileall -q jbl_quantum910_tray.py jbl_battery_simple.py tools

      - name: Smoke test CLI
        run: python jbl_quantum910_tray.py --version

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning *.sh
      - name: Validate systemd unit
        run: systemd-analyze verify --user systemd/jbl-quantum910-tray.service || true
